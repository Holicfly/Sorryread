name: sorryread_mobile
description: "素若阅读 Android 客户端：本地书架与局域网设备同步。"
publish_to: 'none'
version: 0.2.9+12

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.2
  path_provider: ^2.1.6
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  nsd: ^5.0.1
  workmanager: ^0.10.10
  html: ^0.15.7
  csslib: ^1.0.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reader_sources.json
    - assets/font_licenses/
    - assets/fonts/
    - assets/covers/
    - assets/reader_icons/
